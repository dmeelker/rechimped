[package]
name = "rechimped"
version = "0.1.0"
edition = "2024"
# gpui needs a recent compiler (it uses `std::hint::cold_path`, stable since 1.95).
rust-version = "1.95"
description = "Rechimped: desktop GUI (gpui + gpuikit) for viewing and editing your TimeChimp time entries"
license = "Unlicense"

[[bin]]
name = "rechimped"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
futures = "0.3"
gpui = { package = "gpui-unofficial", version = "=1.17.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.17.2", features = ["font-kit"] }
gpuikit = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
timechimp-api = { path = "../timechimp-api" }
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono-tz = "0.10"

[build-dependencies]
embed-resource = "3.0.12"
