[workspace]
members = ["timechimp", "timechimp-gui"]
resolver = "3"

# Smaller release binary (about 13 MB instead of 19 MB): whole-program optimisation, optimising
# for size, and no symbols. Panics still unwind, so a panicking background task is reported
# rather than closing the app.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
