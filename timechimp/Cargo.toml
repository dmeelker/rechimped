[package]
name = "timechimp"
version = "0.1.0"
edition = "2024"
description = "Client for TimeChimp's internal web API, with Cognito SRP login"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
