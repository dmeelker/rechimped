[package]
name = "timechimp-gui"
version = "0.1.0"
edition = "2024"
# gpui needs a recent compiler (it uses `slice::as_array`, stable since 1.93).
rust-version = "1.93"
description = "Desktop GUI (gpui + gpuikit) for viewing and editing your TimeChimp time entries"

[dependencies]
anyhow = "1"
chrono = "0.4"
futures = "0.3"
gpui = { package = "gpui-unofficial", version = "=1.17.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.17.2", features = ["font-kit"] }
gpuikit = "0.9"
serde_json = "1"
timechimp = { path = "../timechimp" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
